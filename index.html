<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>根 — Корни планов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9ece8; --ink:#1b2433; --root:#2b3d55; --soft:#66758a;
  --card:#f6f8f5; --seal:#b5384b; --seal-ink:#fff; --line:rgba(27,36,51,.16); --shadow:rgba(27,36,51,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0f141b;--ink:#e6e9ea;--root:#8da2b9;--soft:#8493a3;--card:#1a2330;--seal:#d9a85f;--seal-ink:#10151c;--line:rgba(230,233,234,.16);--shadow:rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--paper:#0f141b;--ink:#e6e9ea;--root:#8da2b9;--soft:#8493a3;--card:#1a2330;--seal:#d9a85f;--seal-ink:#10151c;--line:rgba(230,233,234,.16);--shadow:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background-color:var(--paper);background-image:radial-gradient(circle,var(--line) 1px,transparent 1.3px);background-size:26px 26px;color:var(--ink);font-family:'Shippori Mincho','Noto Serif',Georgia,serif;overflow:hidden;touch-action:none}
#sun{position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--seal) 0,transparent 66%);opacity:.2;pointer-events:none;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.28}}
#stage{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#stage.pan{cursor:grabbing}
.edge{fill:none;stroke:var(--root);stroke-linecap:round}
.edge.thin{stroke-width:1;opacity:.45}
.node{cursor:pointer;transition:opacity .25s;filter:drop-shadow(0 5px 8px var(--shadow))}
.node.dim{opacity:.22}
.node rect.c{fill:var(--card);stroke:var(--root);stroke-width:1.2}
.node.sel rect.c{stroke:var(--seal);stroke-width:2.4}
.node.link rect.c{stroke-dasharray:5 4}
.node text{fill:var(--ink);pointer-events:none}
.pulse{fill:none;stroke:var(--seal);stroke-width:2;animation:pulse 2s ease-out infinite;pointer-events:none}
@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.07)}}
.pulse{transform-box:fill-box;transform-origin:center}
.t{font-size:15px;font-weight:700}
.d{font-size:11.5px;fill:var(--soft)!important;font-family:'Noto Serif',serif}
.node.done .t{text-decoration:line-through;opacity:.5}
.seal{fill:var(--seal)}.sealt{fill:var(--seal-ink)!important;font-size:12px;font-weight:700}
.late{fill:var(--seal)!important}
.g{stroke-dasharray:1;animation:grow 1.6s ease-out both}
@keyframes grow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.g,.pulse,#sun{animation:none}}
header{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
header .k{writing-mode:vertical-rl;font-size:34px;font-weight:700;line-height:1;color:var(--seal)}
header h1{margin:0;font-size:18px;font-weight:700;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{margin-top:6px;width:150px}
.prog small{font-size:12px;color:var(--soft);font-family:'Noto Serif',serif}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--seal);transition:width .5s}
.tools{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;display:flex;gap:8px}
.side{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 166px);display:grid;gap:8px}
.tools button,.side button{background:var(--card);padding:8px 11px;box-shadow:0 3px 8px var(--shadow)}
.side button{width:42px;height:42px;padding:0;font-size:19px}
button.main{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:700}
#days{position:absolute;top:calc(env(safe-area-inset-top,0px) + 82px);left:12px;right:12px;display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;padding-bottom:4px;scrollbar-width:none}
.day{flex:none;width:44px;padding:6px 0;display:grid;justify-items:center;gap:1px;background:var(--card);border-color:var(--line);line-height:1.1}
.day b{font-size:12px;color:var(--soft)}.day span{font-size:16px;font-weight:700}.day i{font-style:normal;font-size:7px;height:9px;color:var(--seal)}
.day.today{border-color:var(--seal)}.day.on{background:var(--root);color:var(--paper)}.day.on b{color:var(--paper)}
#panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:460px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;touch-action:auto;box-shadow:0 10px 30px var(--shadow)}
.row{display:flex;gap:8px}
input[type=text],input[type=date],textarea{font:inherit;font-size:16px;padding:9px 10px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;width:100%}
input[type=text],input[type=date]{flex:1;min-width:0}
textarea{resize:none;font-size:15px}
button{font:inherit;font-size:14px;padding:9px 12px;color:var(--ink);background:transparent;border:1px solid var(--root);border-radius:4px;cursor:pointer}
button.on{background:var(--root);color:var(--paper)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.hint{font-size:12.5px;color:var(--soft);font-family:'Noto Serif',serif;margin:0;line-height:1.5}
.chips{align-items:center}
.chip{width:26px;height:26px;border-radius:50%;padding:0;background:var(--c);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.chip.on{box-shadow:0 0 0 2px var(--ink)}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,20,.5);backdrop-filter:blur(3px);touch-action:auto}
#sheet[hidden]{display:none}
.box{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.box h2{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.box h3{margin:6px 0 0;font-size:15px;color:var(--seal)}
.box hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
#code,#paste{font:11px/1.35 ui-monospace,Menlo,monospace;height:78px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="sun"></div>
<svg id="stage" aria-label="Карта планов"><g id="world"></g></svg>
<header><div class="k">根</div><div><h1 id="ttl">Корни планов</h1><div class="prog"><small id="pt"></small><div class="bar"><i id="pb"></i></div></div></div></header>
<div class="tools"><button class="main" id="share">送 Отправить</button><button id="theme" title="Тема" aria-label="Сменить тему">月</button></div>
<div class="side"><button id="fit" title="Показать весь план" aria-label="Показать весь план">全</button><button id="tidy" title="Разложить аккуратно" aria-label="Разложить аккуратно">整</button></div>
<div id="days" aria-label="Ближайшие дни"></div>
<div id="panel"></div>

<div id="sheet" hidden>
  <div class="box" role="dialog" aria-label="Обмен планами">
    <h2>Обмен планами <button id="x" aria-label="Закрыть">✕</button></h2>
    <div class="row"><input type="text" id="an" placeholder="Ваше имя (увидит коллега)" aria-label="Ваше имя"></div>
    <div class="row"><input type="text" id="pn" placeholder="Название плана" aria-label="Название плана"></div>
    <h3>Отправить коллеге</h3>
    <textarea id="code" readonly aria-label="Код плана"></textarea>
    <div class="row"><button class="main" id="send" style="flex:1">Поделиться…</button><button id="copy">Копировать</button></div>
    <p class="hint">Отправьте сообщение вместе со ссылкой на это приложение. Коллега откроет его, нажмёт «Отправить» и вставит код в поле ниже.</p>
    <hr>
    <h3>Получить от коллеги</h3>
    <textarea id="paste" placeholder="Вставьте сюда сообщение или код с планом" aria-label="Вставить код"></textarea>
    <div class="row"><button class="main" id="rep" style="flex:1">Заменить мой план</button><button id="add" style="flex:1">Добавить рядом</button></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
var W=156,H=54,KEY='ne-planner-v1',TH='ne-theme';
var wd=['日','月','火','水','木','金','土'];
var COL=['var(--root)','#b5384b','#4f8a6b','#c9a14a','#6c5fa3'];
var S={nodes:[],edges:[],sel:null,link:false,tx:0,ty:0,k:1,title:'',author:'',day:null,anim:false};
var $=function(i){return document.getElementById(i)};
var svg=$('stage'),world=$('world'),panel=$('panel'),sheet=$('sheet'),codeEl=$('code');
function uid(){return 'n'+Math.random().toString(36).slice(2,8)}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function iso(off){var d=new Date();d.setDate(d.getDate()+off);return ymd(d)}
function shift(d,k){var p=d.split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+k))}
function seed(){
  var a={id:uid(),t:'Запуск проекта',d:iso(0),x:0,y:0,done:true};
  var b={id:uid(),t:'Исследование',d:iso(2),x:-190,y:150};
  var c={id:uid(),t:'Дизайн',d:iso(5),x:0,y:180};
  var e={id:uid(),t:'Первый прототип',d:iso(9),x:190,y:150};
  var f={id:uid(),t:'Показ команде',d:iso(14),x:0,y:330};
  S.nodes=[a,b,c,e,f];
  S.edges=[[a.id,b.id],[a.id,c.id],[a.id,e.id],[b.id,f.id],[c.id,f.id],[e.id,f.id]];
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.nodes&&o.nodes.length){S.nodes=o.nodes;S.edges=o.edges||[];S.title=o.title||'';S.author=o.author||'';return}}}catch(x){}
  seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({nodes:S.nodes,edges:S.edges,title:S.title,author:S.author}))}catch(x){}}
function get(id){return S.nodes.find(function(n){return n.id===id})}
function fmt(d){if(!d)return 'без даты';var p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);return dt.toLocaleDateString('ru',{day:'numeric',month:'short'})+' · '+wd[dt.getDay()]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cut(s){return s.length>17?s.slice(0,16)+'…':s}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('show')},2600)}

function render(){
  var h='',today=iso(0);
  S.edges.forEach(function(e){
    var a=get(e[0]),b=get(e[1]);if(!a||!b)return;
    var x1=a.x,y1=a.y+H/2,x2=b.x,y2=b.y-H/2,dy=Math.max(50,Math.abs(y2-y1)*.55);
    var p='M'+x1+' '+y1+' C'+x1+' '+(y1+dy)+' '+x2+' '+(y2-dy)+' '+x2+' '+y2;
    var q='M'+(x1+3)+' '+y1+' C'+(x1+14)+' '+(y1+dy*.9)+' '+(x2-12)+' '+(y2-dy*.8)+' '+(x2-2)+' '+y2;
    var g=S.anim?' g':'',st='style="stroke:'+COL[b.c||0]+'" pathLength="1"';
    h+='<path class="edge'+g+'" '+st+' stroke-width="3.2" d="'+p+'"/><path class="edge thin'+g+'" '+st+' d="'+q+'"/>';
  });
  S.nodes.forEach(function(n){
    var c='node'+(n.id===S.sel?' sel':'')+(S.link&&n.id!==S.sel?' link':'')+(n.done?' done':'')+(S.day&&n.d!==S.day?' dim':'');
    h+='<g class="'+c+'" data-id="'+n.id+'" transform="translate('+(n.x-W/2)+' '+(n.y-H/2)+')">'+
      (n.d===today&&!n.done?'<rect class="pulse" width="'+W+'" height="'+H+'" rx="4"/>':'')+
      '<rect class="c" width="'+W+'" height="'+H+'" rx="4"/><rect width="5" height="'+H+'" rx="2" style="fill:'+COL[n.c||0]+'"/>'+
      '<text class="t" x="12" y="23">'+esc(cut(n.t||'Без названия'))+'</text>'+
      '<text class="d'+(n.d&&n.d<today&&!n.done?' late':'')+'" x="12" y="42">'+fmt(n.d)+(n.n?' · ✎':'')+'</text>'+
      (n.done?'<circle class="seal" cx="'+(W-14)+'" cy="14" r="9"/><text class="sealt" x="'+(W-14)+'" y="18.5" text-anchor="middle">済</text>':'')+
      '</g>';
  });
  world.innerHTML=h;
  world.setAttribute('transform','translate('+S.tx+' '+S.ty+') scale('+S.k+')');
  var s=26*S.k;document.body.style.backgroundSize=s+'px '+s+'px';document.body.style.backgroundPosition=S.tx+'px '+S.ty+'px';
  var dn=S.nodes.filter(function(n){return n.done}).length,tot=S.nodes.length;
  $('pt').textContent='Готово '+dn+' из '+tot;$('pb').style.width=(tot?dn/tot*100:0)+'%';
  $('ttl').textContent=S.title||'Корни планов';
  renderDays();
}
function panelHtml(){
  var n=get(S.sel);
  if(!n){panel.innerHTML='<p class="hint">Коснитесь события, чтобы изменить его. Пустое место двигает карту, щипок — масштаб.</p><div class="row"><button class="main" data-a="addroot" style="flex:1">Новое событие</button></div>';return}
  panel.innerHTML='<div class="row"><input type="text" id="ft" value="'+esc(n.t)+'" placeholder="Название события" aria-label="Название"></div>'+
   '<div class="row"><input type="date" id="fd" value="'+(n.d||'')+'" aria-label="Дата"><label class="chk"><input type="checkbox" id="fx"'+(n.done?' checked':'')+'>Готово</label></div>'+
   '<div class="row chips">'+COL.map(function(c,i){return '<button data-a="col" data-v="'+i+'" class="chip'+((n.c||0)===i?' on':'')+'" style="--c:'+c+'" aria-label="Цвет '+(i+1)+'"></button>'}).join('')+'</div>'+
   '<textarea id="fn" rows="2" placeholder="Заметка: что сделать и зачем" aria-label="Заметка">'+esc(n.n||'')+'</textarea>'+
   '<div class="row"><button class="main" data-a="child">Дать росток</button><button data-a="link" class="'+(S.link?'on':'')+'">'+(S.link?'Выберите событие':'Связать')+'</button><button data-a="del">Удалить</button></div>'+
   (S.link?'<p class="hint">Коснитесь другого события: связь появится или исчезнет.</p>':'');
}
function ui(){panelHtml();render()}
function renderDays(){
  var h='';
  for(var i=0;i<14;i++){var d=iso(i),p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
    var c=S.nodes.filter(function(n){return n.d===d}).length;
    h+='<button data-d="'+d+'" class="day'+(S.day===d?' on':'')+(i?'':' today')+'"><b>'+wd[dt.getDay()]+'</b><span>'+dt.getDate()+'</span><i>'+'●'.repeat(Math.min(c,3))+'</i></button>';}
  $('days').innerHTML=h;
}
$('days').addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b)return;S.day=S.day===b.dataset.d?null:b.dataset.d;render()});
panel.addEventListener('input',function(e){
  var n=get(S.sel);if(!n)return;
  if(e.target.id==='ft')n.t=e.target.value;
  if(e.target.id==='fd')n.d=e.target.value;
  if(e.target.id==='fx')n.done=e.target.checked;
  if(e.target.id==='fn')n.n=e.target.value;
  save();render();
});
panel.addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');if(!a)return;
  var act=a.dataset.a,n=get(S.sel);
  if(act==='addroot')add(null);
  if(act==='col'&&n){n.c=+a.dataset.v;save();ui()}
  if(act==='child'&&n)add(n);
  if(act==='link'){S.link=!S.link;ui()}
  if(act==='del'&&n){S.nodes=S.nodes.filter(function(x){return x.id!==n.id});S.edges=S.edges.filter(function(x){return x[0]!==n.id&&x[1]!==n.id});S.sel=null;S.link=false;save();ui()}
});
function add(p){
  var kids=p?S.edges.filter(function(e){return e[0]===p.id}).length:0;
  var n={id:uid(),t:'Новое событие',d:p&&p.d?shift(p.d,2):iso(0),x:p?p.x+(kids%2?1:-1)*(60+kids*45):-S.tx/S.k+svg.clientWidth/2/S.k,y:p?p.y+150:-S.ty/S.k+svg.clientHeight/3/S.k,done:false};
  S.nodes.push(n);if(p)S.edges.push([p.id,n.id]);
  S.sel=n.id;S.link=false;save();ui();
  var f=$('ft');if(f){f.focus();f.select()}
}

/* pan / zoom / drag */
var drag=null,moved=false,pts={},pinch=null;
function world2(e){var r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-S.tx)/S.k,y:(e.clientY-r.top-S.ty)/S.k}}
svg.addEventListener('pointerdown',function(e){
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(pts).length===2){var v=Object.values(pts);pinch={d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),k:S.k};drag=null;return}
  var g=e.target.closest('.node');moved=false;
  if(g){var n=get(g.dataset.id),w=world2(e);drag={type:'node',id:n.id,ox:n.x-w.x,oy:n.y-w.y,sx:e.clientX,sy:e.clientY}}
  else{drag={type:'pan',sx:e.clientX,sy:e.clientY,tx:S.tx,ty:S.ty};svg.classList.add('pan')}
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',function(e){
  if(pts[e.pointerId])pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pinch&&Object.keys(pts).length===2){var v=Object.values(pts),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);S.k=Math.min(2.2,Math.max(.35,pinch.k*d/pinch.d));render();return}
  if(!drag)return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4)moved=true;
  if(!moved)return;
  if(drag.type==='node'){var n=get(drag.id),w=world2(e);n.x=w.x+drag.ox;n.y=w.y+drag.oy}
  else{S.tx=drag.tx+e.clientX-drag.sx;S.ty=drag.ty+e.clientY-drag.sy}
  render();
});
function up(e){
  delete pts[e.pointerId];if(Object.keys(pts).length<2)pinch=null;
  if(!drag)return;
  var d=drag;drag=null;svg.classList.remove('pan');
  if(d.type==='node'){
    if(!moved){
      if(S.link&&S.sel&&d.id!==S.sel){
        var i=S.edges.findIndex(function(x){return (x[0]===S.sel&&x[1]===d.id)||(x[0]===d.id&&x[1]===S.sel)});
        if(i>=0)S.edges.splice(i,1);else S.edges.push([S.sel,d.id]);
        S.link=false;save();ui();return
      }
      S.sel=d.id;S.link=false;ui();return
    }
    save();
  }else if(!moved){S.sel=null;S.link=false;ui()}
}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',function(e){
  e.preventDefault();var r=svg.getBoundingClientRect(),k0=S.k;
  S.k=Math.min(2.2,Math.max(.35,S.k*(e.deltaY<0?1.1:.9)));
  var mx=e.clientX-r.left,my=e.clientY-r.top;
  S.tx=mx-(mx-S.tx)*S.k/k0;S.ty=my-(my-S.ty)*S.k/k0;render();
},{passive:false});

function fit(){
  var vw=svg.clientWidth,vh=svg.clientHeight;
  if(!S.nodes.length){S.tx=vw/2;S.ty=vh/3;S.k=1;render();return}
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.nodes.forEach(function(n){x0=Math.min(x0,n.x-W/2);x1=Math.max(x1,n.x+W/2);y0=Math.min(y0,n.y-H/2);y1=Math.max(y1,n.y+H/2)});
  var availH=vh-350,availW=vw-80;
  S.k=Math.min(1.2,Math.max(.35,Math.min(availW/(x1-x0),availH/(y1-y0))));
  S.tx=vw/2-(x0+x1)/2*S.k;S.ty=150+(availH-(y1-y0)*S.k)/2-y0*S.k;render();
}
function tidy(){
  var dep={};S.nodes.forEach(function(n){dep[n.id]=0});
  for(var it=0;it<S.nodes.length;it++){var ch=false;S.edges.forEach(function(e){if(dep[e[0]]!==undefined&&dep[e[1]]!==undefined&&dep[e[1]]<dep[e[0]]+1&&dep[e[0]]<S.nodes.length){dep[e[1]]=dep[e[0]]+1;ch=true}});if(!ch)break}
  var rows={};S.nodes.forEach(function(n){(rows[dep[n.id]]=rows[dep[n.id]]||[]).push(n)});
  Object.keys(rows).forEach(function(r){var a=rows[r].sort(function(p,q){return p.x-q.x});a.forEach(function(n,i){n.x=(i-(a.length-1)/2)*(W+36);n.y=r*150})});
  save();fit();toast('План разложен');
}
$('fit').onclick=fit;$('tidy').onclick=tidy;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem(TH,t)}catch(x){}}
$('theme').onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark')};
try{var th=localStorage.getItem(TH);if(th)document.documentElement.dataset.theme=th}catch(x){}

/* share / import */
function b64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var a=atob(s),u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u}
async function enc(o){
  var b=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{var r=await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'R2.'+b64(new Uint8Array(r))}catch(e){}}
  return 'R1.'+b64(b);
}
async function dec(txt){
  var m=String(txt).match(/R([12])\.([A-Za-z0-9_-]{8,})/);if(!m)throw new Error('no code');
  var u=unb64(m[2]);
  if(m[1]==='2')u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(u));
}
function clean(o){
  if(!o||!Array.isArray(o.nodes)||!o.nodes.length)throw new Error('bad');
  var ids={},nodes=o.nodes.slice(0,300).filter(function(n){return n&&typeof n.id==='string'&&isFinite(n.x)&&isFinite(n.y)}).map(function(n){ids[n.id]=1;return{id:n.id,t:String(n.t||'').slice(0,80),d:/^\d{4}-\d\d-\d\d$/.test(n.d||'')?n.d:'',x:+n.x,y:+n.y,done:!!n.done,c:Math.min(4,Math.max(0,n.c|0)),n:String(n.n||'').slice(0,500)}});
  var edges=(Array.isArray(o.edges)?o.edges:[]).filter(function(e){return Array.isArray(e)&&ids[e[0]]&&ids[e[1]]}).map(function(e){return[e[0],e[1]]});
  return{title:String(o.title||'').slice(0,60),author:String(o.author||'').slice(0,40),nodes:nodes,edges:edges};
}
async function refreshCode(){
  codeEl.value='…';
  codeEl.value=await enc({v:1,title:S.title,author:S.author,nodes:S.nodes.map(function(n){return{id:n.id,t:n.t,d:n.d||'',x:Math.round(n.x),y:Math.round(n.y),done:!!n.done,c:n.c||0,n:n.n||''}}),edges:S.edges});
}
function message(){return 'Корни планов 根 — план «'+(S.title||'без названия')+'»'+(S.author?' от '+S.author:'')+'.\nОткройте приложение → «Отправить» → вставьте этот код в поле «Получить от коллеги».\n\n'+codeEl.value}
async function copy(t){
  try{await navigator.clipboard.writeText(t);toast('Скопировано');return}catch(e){}
  try{codeEl.focus();codeEl.select();if(document.execCommand('copy')){toast('Скопировано');return}}catch(e){}
  toast('Выделите код и скопируйте вручную');
}
function openSheet(){$('an').value=S.author;$('pn').value=S.title;sheet.hidden=false;refreshCode()}
function closeSheet(){sheet.hidden=true}
$('share').onclick=openSheet;$('x').onclick=closeSheet;
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
$('an').addEventListener('input',function(e){S.author=e.target.value;save();refreshCode()});
$('pn').addEventListener('input',function(e){S.title=e.target.value;save();render();refreshCode()});
$('copy').onclick=function(){copy(message())};
$('send').onclick=async function(){
  if(navigator.share){try{await navigator.share({title:'Корни планов',text:message()});return}catch(e){if(e&&e.name==='AbortError')return}}
  copy(message());
};
async function imp(mode){
  var o;try{o=clean(await dec($('paste').value))}catch(e){toast('Код не распознан — вставьте его целиком');return}
  if(mode==='rep'){S.nodes=o.nodes;S.edges=o.edges;if(o.title)S.title=o.title}
  else{
    var mx=-1e9,mn=1e9,map={};
    S.nodes.forEach(function(n){mx=Math.max(mx,n.x)});o.nodes.forEach(function(n){mn=Math.min(mn,n.x)});
    var dx=S.nodes.length?mx-mn+W+50:0;
    o.nodes.forEach(function(n){map[n.id]=uid();n.id=map[n.id];n.x+=dx;S.nodes.push(n)});
    o.edges.forEach(function(e){S.edges.push([map[e[0]],map[e[1]]])});
  }
  S.sel=null;S.link=false;S.day=null;save();ui();fit();closeSheet();$('paste').value='';
  toast('Получен план'+(o.author?' от '+o.author:'')+' · '+o.nodes.length+' событий');
}
$('rep').onclick=function(){imp('rep')};$('add').onclick=function(){imp('add')};

window.addEventListener('resize',render);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!sheet.hidden){closeSheet();return}
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if((e.key==='Delete'||e.key==='Backspace')&&S.sel){var b=panel.querySelector('[data-a=del]');if(b)b.click()}
  if(e.key==='Enter'&&S.sel){var c=get(S.sel);if(c)add(c)}
});
S.anim=true;load();ui();fit();setTimeout(function(){S.anim=false},1700);
})();
</script>
